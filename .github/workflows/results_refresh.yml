name: Results refresh

# Separate from weekly_data_pull.yml on purpose: this is JUST a results refresh
# (fresh scores + rebuilt site), not the full daily pipeline. Deliberately does NOT
# touch odds/injuries/snap-counts/weather/predictions/explanations -- no Claude
# routine involved, no new predictions, and no re-pulled lines (The Odds API budget
# is shared with the CFB project, so it's left alone here on purpose).
#
# REWRITTEN 2026-09-10 after a real incident on the CFB side: that project's own
# results_refresh.yml used a hand-picked list of day-specific checkpoints and
# explicitly assumed "no games on day X" for some days -- which turned out to be
# false (a real Monday CFB game sat unscored for 3 days as a result). This workflow
# used a similar day-specific-checkpoint design (heavier on Sun/Mon, lighter on
# Thu/Fri, nothing at all outside those 5 days) -- same fragile shape, same class of
# risk, even though no incident had actually hit yet here. Replaced with a uniform
# every-2-hours, every-day cron instead of trying to hand-enumerate NFL's kickoff
# windows. Unlike CFB, there's no metered third-party API cost to weigh here --
# scripts/backfill_schedules.py pulls from nflverse's free, unmetered, GitHub-hosted
# schedule data (~4s per run, confirmed) -- so there's no reason to be as
# conservative as the CFB version has to be. Worst-case staleness is now a uniform
# <=2h every single day, with no "does this day matter" judgment call left to get
# wrong.
#
# Season-scoped 2026-09-10 (per user request -- no need to poll year-round when
# there's nothing to refresh): August (preseason) through February (Super Bowl).
# Cron's month field doesn't wrap a range across the year boundary, so it's listed
# as two pieces, "8-12,1,2" -- same 5 months either way.
on:
  schedule:
    - cron: "0 */2 * 8-12,1,2 *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh current-season scores
        run: python scripts/backfill_schedules.py 2025 2026

      - name: Rebuild site
        run: python scripts/build_site.py

      - name: Commit and push if scores changed
        # Retries on push rejection: now that this runs every 2h, it can genuinely
        # collide with weekly_data_pull.yml's own push (that job runs ~13:00 UTC and
        # takes a few minutes) -- confirmed for real 2026-09-11, a run's fresh commit
        # was silently dropped on a bare `git push` when weekly_data_pull won the
        # race. Rebase-and-retry instead of failing once.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nfl_stats.db docs/index.html
          git diff --cached --quiet && echo "No score changes" && exit 0
          git commit -m "Results refresh: $(date -u +%Y-%m-%dT%H:%M)Z"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- another workflow pushed in the meantime, rebasing and retrying..."
            git fetch origin master
            git rebase origin/master
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::Push failed after 5 attempts."
          exit 1
