name: Sunday results refresh

# Separate from weekly_data_pull.yml on purpose: this is JUST a results refresh
# (fresh scores + rebuilt site), not the full daily pipeline. Deliberately does NOT
# touch odds/injuries/snap-counts/weather/predictions/explanations -- no Claude
# routine involved, no new predictions, and no re-pulled lines (The Odds API budget
# is shared with the CFB project, so it's left alone here on purpose). Exists solely
# so the site doesn't show stale scores for up to 24 hours on the NFL's biggest game
# day.
#
# 4 fixed times spanning NFL Sunday's actual kickoff windows, evenly 3h apart (times
# in EDT; GitHub cron is fixed UTC and doesn't track DST, so these drift an hour
# earlier in US-clock terms once EST starts in November -- same caveat as
# weekly_data_pull.yml):
#   4:00pm ET  (20:00 UTC Sun) -- catches the 1:00pm-kickoff early window's finals
#   7:00pm ET  (23:00 UTC Sun) -- catches the 4:00/4:25pm-kickoff late window's finals
#   10:00pm ET (02:00 UTC Mon) -- catches most of Sunday Night Football
#   1:00am ET  (05:00 UTC Mon) -- catches the latest West Coast SNF finals
# The last two land on a UTC-calendar Monday even though they're still "Sunday
# night" in US time -- that's correct, not a bug, and separate from Monday's own
# unrelated 13:00 UTC standing run in weekly_data_pull.yml.
on:
  schedule:
    - cron: "0 20 * * 0"
    - cron: "0 23 * * 0"
    - cron: "0 2 * * 1"
    - cron: "0 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh current-season scores
        run: python scripts/backfill_schedules.py 2025 2026

      - name: Rebuild site
        run: python scripts/build_site.py

      - name: Commit and push if scores changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nfl_stats.db docs/index.html
          git diff --cached --quiet && echo "No score changes" && exit 0
          git commit -m "Results refresh: $(date -u +%Y-%m-%dT%H:%M)Z"
          git push
