name: Results refresh

# Separate from weekly_data_pull.yml on purpose: this is JUST a results refresh
# (fresh scores + rebuilt site), not the full daily pipeline. Deliberately does NOT
# touch odds/injuries/snap-counts/weather/predictions/explanations -- no Claude
# routine involved, no new predictions, and no re-pulled lines (The Odds API budget
# is shared with the CFB project, so it's left alone here on purpose).
#
# REWRITTEN 2026-09-10 after a real incident on the CFB side (a hand-picked
# day-of-week checkpoint list there assumed "no games on Monday," which was false
# and left a real game unscored for 3 days). Replaced with a uniform every-2-hours,
# every-day cron here as a first pass, since there's no metered API cost to weigh
# for NFL (scripts/backfill_schedules.py pulls from nflverse's free, unmetered
# schedule data) -- simplicity over hand-enumeration.
#
# TAPERED BY DAY OF WEEK 2026-09-11, per user request (same treatment just applied to
# the CFB sibling project), after the uniform version felt too frequent. Measured the
# actual 2026 regular-season schedule (data/nfl_stats.db, `games` table) instead of
# guessing: Sun 228, Thu 19, Mon 17, Fri 4, Sat 2, Wed 2, Tue 0. NFL's shape is
# different from CFB's -- one dominant day (Sunday, ~84% of the season) plus two
# REGULAR single-game weekly slots (TNF Thursday, MNF Monday) with predictable
# timing, rather than CFB's broader Fri/Sat/Sun spread.
#
# Three tiers:
#   - Sunday (228 games): 4 checkpoints spanning early/late/SNF windows, reused from
#     this workflow's own pre-uniform-rewrite design (already validated against real
#     kickoff-window clustering).
#   - Thursday/Monday (TNF/MNF, 19/17 games, same predictable ~8:15pm ET kickoff
#     every week): 1 checkpoint each (Monday gets a 2nd, later one too, since MNF
#     sometimes runs long or has a West Coast game).
#   - Friday/Saturday/Wednesday/Tuesday (4/2/2/0 games): 1 checkpoint each, even
#     Tuesday despite its real, measured zero -- the CFB incident this rewrite is
#     named after was caused by trusting an ASSUMPTION of zero, not a measured one,
#     but the lesson learned was to stop trusting that judgment call at all when the
#     checkpoint is this cheap (nflverse pull has no metered cost either way).
#     Saturday's checkpoint is month-scoped to Dec-Jan only, unlike the other rare
#     days -- the NFL only schedules Saturday games in the season's final weeks by
#     rule, so a Saturday checkpoint any other month would be a guaranteed no-op.
# Net effect: 11 checkpoints/week instead of the uniform version's ~84 -- far less
# git churn for no loss of real coverage, verified by checking every one of the 7 UTC
# days-of-week still has at least one entry (never collapsing a day to zero, the
# actual lesson from the CFB incident, regardless of what this week's measured count
# for that day happens to be).
#
# RETIMED 2026-09-20 from measured game end times (last play's timestamp in nflverse
# pbp, 2023-2025 regular season, 816 games). The old checkpoints sat ~2h43m after
# kickoff, but games average ~3h05m, so every primary checkpoint fired before the
# AVERAGE game in its window had ended:
#   window    avg end  p90 end  latest   old check  new check (ET)
#   Sun 1pm   3:57pm   4:20pm   5:12pm   3:43pm     4:53pm
#   Sun 4pm   7:19pm   7:37pm   8:05pm   7:13pm     8:13pm
#   SNF      11:28pm  11:37pm  12:58am  10:43pm    12:13am (+2:13am backstop)
#   TNF      11:22pm  11:37pm  12:17am  11:13pm    12:13am
#   MNF      11:14pm  11:42pm   1:29am  11:13pm    12:13am (+2:13am backstop)
# Each new check is ~30min past the p90 end, leaving room for nflverse to publish the
# final (that lag is not measured yet). The rare days (Fri/Sat/Wed/Tue) moved to the
# same 12:13am slot, which covers an 8:15pm kickoff.
#
# DST: GitHub cron is fixed UTC, so each checkpoint is listed twice -- once for EDT
# months (8-10) and once for EST months (11-12,1,2). The season crosses exactly one
# DST change (first Sunday of November); spring-forward in March is after it ends.
# In years where November starts before that Sunday (e.g. 2027: Nov 1-6 still EDT),
# the EST line lands an hour LATER in US clock time, never earlier -- the safe side.
# A UTC day-of-week that differs from the US-time day label (e.g. TNF's checkpoint
# landing on UTC-Friday) is correct, not a bug -- a post-midnight ET checkpoint lands
# on the following UTC calendar day.
#
# Minute offset to :13, not :00 -- GitHub Actions explicitly documents that scheduled
# workflows can be delayed or dropped during high-load periods, and "high load"
# specifically means the top of every hour. Confirmed for real the day the uniform
# version went live: of ~8 expected every-2h fires in a 16h window, only 2 actually
# ran, the rest silently never fired.
#
# Season-scoped (Aug-Feb) since 2026-09-10 -- no need to poll year-round when there's
# nothing to refresh. Cron's month field doesn't wrap a range across the year
# boundary, so it's listed as two pieces, "8-12,1,2" -- same 5 months either way.
on:
  schedule:
    # Sunday 1pm window -- 4:53pm ET
    - cron: "53 20 * 8-10 0"
    - cron: "53 21 * 11-12,1,2 0"
    # Sunday 4pm window -- 8:13pm ET
    - cron: "13 0 * 8-10 1"
    - cron: "13 1 * 11-12,1,2 1"
    # SNF -- 12:13am ET
    - cron: "13 4 * 8-10 1"
    - cron: "13 5 * 11-12,1,2 1"
    # Sunday backstop -- 2:13am ET
    - cron: "13 6 * 8-10 1"
    - cron: "13 7 * 11-12,1,2 1"
    # Thursday -- TNF (12:13am ET)
    - cron: "13 4 * 8-10 5"
    - cron: "13 5 * 11-12,1,2 5"
    # Monday -- MNF (12:13am ET, plus 2:13am backstop)
    - cron: "13 4 * 8-10 2"
    - cron: "13 5 * 11-12,1,2 2"
    - cron: "13 6 * 8-10 2"
    - cron: "13 7 * 11-12,1,2 2"
    # Friday -- rare (12:13am ET)
    - cron: "13 4 * 8-10 6"
    - cron: "13 5 * 11-12,1,2 6"
    # Saturday -- rare, Dec-Jan only by rule, always EST (12:13am ET)
    - cron: "13 5 * 12,1 0"
    # Wednesday -- rare (12:13am ET)
    - cron: "13 4 * 8-10 4"
    - cron: "13 5 * 11-12,1,2 4"
    # Tuesday -- measured zero this season, kept anyway (12:13am ET, cheap and unmetered)
    - cron: "13 4 * 8-10 3"
    - cron: "13 5 * 11-12,1,2 3"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Caches downloaded wheels only (requirements.txt is unpinned, so pip still
          # resolves current versions). Installing took 29s of this ~40s job.
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh current-season scores
        run: python scripts/backfill_schedules.py 2025 2026

      - name: Rebuild site
        run: python scripts/build_site.py

      - name: Commit and push if the site changed
        # Retries on push rejection: can genuinely collide with weekly_data_pull.yml's
        # own push (that job runs ~13:00 UTC and takes a few minutes) -- confirmed for
        # real 2026-09-11, a run's fresh commit was silently dropped on a bare
        # `git push` when weekly_data_pull won the race. Rebase-and-retry instead of
        # failing once.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Commit only the rebuilt page, never data/nfl_stats.db (~43MB): this job re-pulls
          # scores from nflverse every run anyway, and weekly_data_pull.yml still commits the
          # DB daily, so committing it here just added a 43MB blob per run (22 of the last 22
          # refresh commits carried one). Discard the runner's DB edits after the site is built
          # from them. Consequence: between daily pulls, a fresh clone's DB has scores only up
          # to the last pull while the published page is current -- expected, not a bug.
          # Safe for the Claude routine because predict_games.py's own kickoff guard (2cbc7af)
          # refuses to pick a game that has started, even if its clone still shows no score.
          git checkout -- data/nfl_stats.db
          # build_site.py stamps "Generated <time> UTC." on every run, so a checkpoint with no
          # new scores would still commit a one-line diff. Compare both versions with that line
          # removed and skip when nothing else moved.
          if git diff --quiet -- docs/index.html; then
            echo "No site changes"; exit 0
          fi
          git show HEAD:docs/index.html | grep -v '^    <p>Generated ' > /tmp/site_was.html
          grep -v '^    <p>Generated ' docs/index.html > /tmp/site_now.html
          if cmp -s /tmp/site_was.html /tmp/site_now.html; then
            echo "Only the generated timestamp changed -- not committing"; exit 0
          fi
          git add docs/index.html
          git commit -m "Results refresh: $(date -u +%Y-%m-%dT%H:%M)Z"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- another workflow pushed in the meantime, rebasing and retrying..."
            git fetch origin master
            git rebase origin/master
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::Push failed after 5 attempts."
          exit 1
