name: Results refresh

# Separate from weekly_data_pull.yml on purpose: this is JUST a results refresh
# (fresh scores + rebuilt site), not the full daily pipeline. Deliberately does NOT
# touch odds/injuries/snap-counts/weather/predictions/explanations -- no Claude
# routine involved, no new predictions, and no re-pulled lines (The Odds API budget
# is shared with the CFB project, so it's left alone here on purpose).
#
# Monday matters more than it looks: weekly_data_pull.yml's standing cadence is
# Thu-Mon, skipping Tue/Wed entirely -- with no Monday-night catch-up, an MNF
# result would sit stale until the FOLLOWING Thursday's run, not just overnight.
# Sunday's own spread (early/late/SNF windows) has the same up-to-24h staleness
# problem the Saturday-equivalent CFB refresh solves. Thursday and Friday get
# lighter coverage since those are usually single-game (TNF) or rare (occasional
# Friday games -- Black Friday, international slates) rather than a full slate.
#
# All times below in EDT; GitHub cron is fixed UTC and doesn't track DST, so these
# drift an hour earlier in US-clock terms once EST starts in November -- same
# caveat as weekly_data_pull.yml. A UTC day-of-week that differs from the US-time
# day label (e.g. "1:30am ET Tuesday" landing on UTC-Tuesday but referring to a
# Monday-night game) is correct, not a bug.
#
# Thursday -- TNF, single game, kickoff ~8:15pm ET:
#   11:30pm ET (03:30 UTC Fri)
# Friday -- rare (Black Friday game, international slates); one checkpoint is
# enough for an irregular single-game day, harmless (no-op commit) most weeks:
#   11:00pm ET (03:00 UTC Sat)
# Sunday -- the main slate, early/late/SNF windows:
#   3:30pm ET  (19:30 UTC Sun) -- catches the 1:00pm-kickoff early window's finals
#   6:30pm ET  (22:30 UTC Sun) -- catches the 4:00/4:25pm-kickoff late window's finals
#   9:30pm ET  (01:30 UTC Mon) -- catches most of Sunday Night Football
#   12:30am ET (04:30 UTC Mon) -- catches the latest West Coast SNF finals
# Monday -- MNF, kickoff ~8:15pm ET (occasionally two games early season):
#   11:30pm ET (03:30 UTC Tue) -- catches most MNF finishes
#   1:30am ET  (05:30 UTC Tue) -- catches West Coast MNF / overtime finishes, ahead
#                                  of the Tue/Wed gap in the standing cadence
on:
  schedule:
    - cron: "30 3 * * 5"
    - cron: "0 3 * * 6"
    - cron: "30 19 * * 0"
    - cron: "30 22 * * 0"
    - cron: "30 1 * * 1"
    - cron: "30 4 * * 1"
    - cron: "30 3 * * 2"
    - cron: "30 5 * * 2"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh current-season scores
        run: python scripts/backfill_schedules.py 2025 2026

      - name: Rebuild site
        run: python scripts/build_site.py

      - name: Commit and push if scores changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nfl_stats.db docs/index.html
          git diff --cached --quiet && echo "No score changes" && exit 0
          git commit -m "Results refresh: $(date -u +%Y-%m-%dT%H:%M)Z"
          git push
