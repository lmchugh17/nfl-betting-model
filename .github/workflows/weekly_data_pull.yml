name: Weekly data pull

on:
  schedule:
    # 13:00 UTC = 7am America/Denver during MDT (Mar-Nov), 6am during MST
    # (Nov-Mar, GitHub cron is fixed UTC and doesn't track DST).
    # STANDING CADENCE as of 2026-09-05: Thursday-Monday (4,5,6,0,1), matching the CFB
    # project's own schedule and covering every day an NFL game is actually played --
    # Thu (TNF), Fri (final injury designations), Sat (late-season Saturday games),
    # Sun (main slate + line movement into kickoff), Mon (MNF). Drops the previous
    # Wednesday slate-preview/opening-lines pull (a deliberate trade -- Wednesday's own
    # results/lines still land one day later via Thursday's pull, just not as early).
    # Minute offset to :06, not :00 (2026-09-11): avoids GitHub Actions' documented
    # top-of-hour scheduling congestion -- see results_refresh.yml's own comment for
    # the real delayed/dropped-fire evidence that prompted this across both workflows.
    - cron: "6 13 * * 4,5,6,0,1"  # Thu-Mon
    # Wednesday REDUNDANCY pull (2026-09-14), in-season only (Aug-Feb). Not a return to the
    # old Wednesday slate-preview pull: it skips The Odds API (see the odds step's `if`), so
    # it costs no credits from the budget shared with the CFB project. What it buys: a failed
    # Monday pull gets recovered before Thursday instead of leaving nothing fresh until
    # Thursday afternoon, and Thursday's first gated routine run (15:05 UTC) opens on
    # Wednesday's schedules/injuries/weather instead of Monday's -- this pull has landed
    # 2h41m-5h26m late (2026-09-05 to 09-14), so Thursday's own pull often isn't in by then.
    # The commit message stays "Weekly data pull:" on purpose -- the routine's gate keys on it.
    # If you change this cron string, change the odds step's `if` to match exactly.
    - cron: "6 13 * 8-12,1,2 3"  # Wed, no odds
    # THANKSGIVING 2026 exception (added 2026-09-14): an early extra pull on Thu 11-26,
    # odds included. CHI @ DET kicks off 13:00 ET = 18:00 UTC, but the regular 13:06 UTC
    # pull has landed as late as 18:32 UTC, so without this the game would keep a pick
    # from Wednesday's data. 09:06 UTC leaves room for an 8h delay before the routine's
    # last pre-kickoff try (17:05 UTC). The regular 13:06 pull still runs afterwards
    # and refreshes PHI @ DAL (21:30 UTC) and KC @ BUF (01:20 UTC Fri). Also picks up
    # Wednesday night's GB @ LA score early. Day-of-month cron, so it fires every Nov 26:
    # update the date for next season's Thanksgiving or remove it.
    - cron: "6 9 26 11 *"  # Thanksgiving 2026 early pull
    # SUNDAY EARLY pull (2026-09-25), in-season only. The regular 13:06 UTC pull has
    # been landing later each week -- 16:22, 16:45, 17:49, 17:52, 17:54 UTC over
    # 09-19..09-25 -- while the main Sunday slate kicks off at 17:00 UTC (1pm ET). So
    # the 9-10 early games were getting picks built on Friday/Saturday data, every
    # week (confirmed for Week 1 and Week 2). 09:06 UTC leaves room for a ~6h delay
    # and still beats the routine's 15:05/16:05 tries, which are the last two that can
    # publish before a 1pm kickoff. Odds ARE included here (unlike the Wednesday
    # redundancy pull): 3 credits, ~13/month on the budget shared with the CFB project
    # (359 of 500 remaining on 2026-09-25). The regular 13:06 Sunday pull still runs
    # and refreshes lines for the 4:05/4:25pm and SNF windows.
    - cron: "6 9 * 8-12,1,2 0"  # Sunday early pull, odds included
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  pull-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Caches downloaded wheels only (requirements.txt is unpinned, so pip still
          # resolves current versions). Installing took 35s of this run.
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh schedules (games, lines, weather, QBs, coaches)
        # Last 2 seasons only, not the full 1999+ history -- catches this
        # week's results plus any retroactive nflverse corrections without
        # re-downloading/re-writing 27 seasons on every single pull.
        run: python scripts/backfill_schedules.py 2025 2026

      - name: Refresh play-by-play -> team_game_epa
        run: python scripts/backfill_epa.py 2025 2026

      - name: Refresh injuries and snap counts
        run: python scripts/scrape_injuries.py

      - name: Pull live odds
        # Skipped on the Wednesday redundancy schedule only (credits); still runs on the
        # Thu-Mon schedule and on workflow_dispatch, where github.event.schedule is empty.
        if: github.event.schedule != '6 13 * 8-12,1,2 3'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/pull_odds.py

      - name: Pull forecast weather for upcoming outdoor games
        run: python scripts/pull_weather_forecast.py

      - name: Pull Polymarket pre-game win probabilities
        run: python scripts/pull_polymarket.py

      - name: Archive and prune stale live-odds snapshots
        run: python scripts/prune_live_data.py

      - name: Rebuild game_features
        run: python scripts/build_features.py

      - name: Commit and push refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nfl_stats.db
          # live_odds_archive.csv only exists once prune_live_data.py has actually
          # pruned a stale row -- won't happen on most early-season runs (nothing
          # is stale yet). `git add` on a pathspec matching zero files (not even as
          # untracked) exits 128 and aborts the whole step, silently losing this
          # run's real nfl_stats.db update too -- confirmed live 2026-09-04, the
          # first real workflow_dispatch run hit exactly this.
          if [ -f data/live_odds_archive.csv ]; then
            git add data/live_odds_archive.csv
          fi
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "Weekly data pull: $(date -u +%Y-%m-%d)"
          # Retries on push rejection -- this run takes a few minutes, and
          # results_refresh.yml now runs every 2h, so the two can genuinely race
          # for the ref (confirmed for real 2026-09-11: a results_refresh push got
          # rejected mid-collision with this workflow). Rebase-and-retry rather
          # than a bare push that fails once and drops the whole run's work.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- another workflow pushed in the meantime, rebasing and retrying..."
            git fetch origin master
            git rebase origin/master
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::Push failed after 5 attempts."
          exit 1
